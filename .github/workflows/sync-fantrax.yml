name: Sync Fantrax Data

on:
  schedule:
    # Runs every day at 9:00am UTC. Change the cron value to run more or
    # less often. https://crontab.guru is a handy tool for this.
    - cron: "0 9 * * *"
  workflow_dispatch: {} # lets you click "Run workflow" manually on GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Fantrax sync
        env:
          FANTRAX_LEAGUE_ID: ${{ secrets.FANTRAX_LEAGUE_ID }}
        run: node scripts/sync-fantrax.mjs

      - name: Commit updated data, if any
        run: |
          git config user.name "Fantrax Sync Bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Auto-sync Fantrax data"
          git push
